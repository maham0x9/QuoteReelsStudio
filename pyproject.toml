[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quote-reels-studio"
version = "0.1.0"
description = "Lightweight Windows desktop app that mass-produces vertical quote videos using Pexels/Pixabay backgrounds."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Maham Nadeem" }]
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.6",
    "requests>=2.31",
    "Pillow>=10.0",
    "moviepy>=1.0.3",
    "imageio-ffmpeg>=0.4.9",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.3"]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
quote-reels-studio = "main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
